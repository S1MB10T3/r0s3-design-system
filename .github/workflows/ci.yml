name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    name: Tokens, plugin, generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated output is committed and fresh
        run: git diff --exit-code -- packages/tokens/dist Sources

  swift:
    name: Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
